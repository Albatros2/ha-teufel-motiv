name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release zip
        run: |
          cp README.md custom_components/teufel_lan/
          cd custom_components/teufel_lan
          zip -r ../../teufel_lan.zip . \
            -x "__pycache__/*" "*.pyc"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: teufel_lan.zip
